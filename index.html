<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Map Walker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#10131a; --panel:#1b2030; --fg:#f2f4f8; --accent:#ffb703; --muted:#8b93a7; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overscroll-behavior:none; }
  #setup { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; z-index:2000; background:var(--bg); overflow:auto; }
  .card { background:var(--panel); border-radius:16px; padding:24px; width:100%; max-width:440px; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  p.sub { margin:0 0 20px; color:var(--muted); }
  label { display:block; font-weight:600; margin:16px 0 8px; }
  .chars { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .chars button { font-size:2rem; padding:10px 0; background:#262d42; border:2px solid transparent; border-radius:12px; cursor:pointer; }
  .chars button[aria-checked="true"] { border-color:var(--accent); background:#33304a; }
  input[type=text] { width:100%; padding:12px; font-size:1rem; border-radius:10px; border:2px solid #262d42; background:#0d1017; color:var(--fg); }
  input[type=text]:focus { outline:none; border-color:var(--accent); }
  [hidden] { display:none!important; }
  .primary { width:100%; margin-top:20px; padding:14px; font-size:1.05rem; font-weight:700; border:0; border-radius:12px; background:var(--accent); color:#1a1300; cursor:pointer; }
  .primary:disabled { opacity:.6; cursor:wait; }
  .link { background:transparent; color:var(--muted); border:0; padding:6px 0; font-size:.95rem; cursor:pointer; }
  .stephead { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  #chosenChar { font-size:1.6rem; }
  .tiny { margin:8px 0 0; color:var(--muted); font-size:.75rem; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .combo { position:relative; }
  #sugg { position:absolute; left:0; right:0; top:calc(100% + 4px); max-height:50vh; overflow:auto; list-style:none; margin:0; padding:4px; background:#0d1017; border:2px solid #262d42; border-radius:10px; z-index:10; }
  #sugg li { min-height:44px; padding:10px 12px; border-radius:8px; cursor:pointer; display:flex; flex-direction:column; justify-content:center; }
  #sugg li .main { color:var(--fg); font-weight:600; }
  #sugg li .sec { color:var(--muted); font-size:.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #sugg li[aria-selected=true], #sugg li:hover { background:#262d42; }
  #sugg li.info { color:var(--muted); cursor:default; }
  #err { color:#ff7b7b; min-height:1.2em; margin:10px 0 0; font-size:.9rem; }
  #game { position:fixed; inset:0; display:none; }
  #map { position:absolute; inset:0; }
  .hero { font-size:34px; line-height:1; text-align:center; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); transition:transform .1s; }
  .hero.flip span { display:inline-block; transform:scaleX(-1); }
  #hud { position:absolute; top:10px; left:10px; right:10px; z-index:1000; display:flex; gap:8px; align-items:center; pointer-events:none; }
  #hud .pill { pointer-events:auto; background:rgba(16,19,26,.85); color:var(--fg); padding:8px 12px; border-radius:999px; font-size:.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #hud .grow { flex:1; min-width:0; }
  #hud button { pointer-events:auto; border:0; background:rgba(16,19,26,.85); color:var(--fg); padding:8px 12px; border-radius:999px; font-size:.85rem; cursor:pointer; }
  #dpad { position:absolute; right:18px; bottom:28px; z-index:1000; width:150px; height:150px; display:none; touch-action:none; user-select:none; -webkit-user-select:none; }
  #dpad button { position:absolute; width:50px; height:50px; border:0; border-radius:12px; background:rgba(16,19,26,.75); color:#fff; font-size:1.3rem; touch-action:none; }
  #dpad .u { left:50px; top:0; } #dpad .d { left:50px; bottom:0; } #dpad .l { left:0; top:50px; } #dpad .r { right:0; top:50px; }
  #dpad button.on { background:var(--accent); color:#000; }
  @media (pointer:coarse), (max-width:700px) { #dpad { display:block; } #keys { display:none; } }
</style>
</head>
<body>
<div id="setup">
  <section class="card step" id="step1">
    <h1>🗺️ Map Walker</h1>
    <p class="sub">Pick your character</p>
    <div class="chars" id="chars" role="radiogroup" aria-label="Character"></div>
    <button id="next1" class="primary" type="button">Next</button>
  </section>
  <form class="card step" id="step2" hidden>
    <div class="stephead">
      <button id="back1" class="link" type="button">← Back</button>
      <span id="chosenChar" aria-hidden="true"></span>
    </div>
    <h1>Pick location</h1>
    <label for="addr">Address</label>
    <div class="combo">
      <input type="text" id="addr" placeholder="e.g. 1600 Pennsylvania Ave, Washington DC" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugg" autocomplete="off" spellcheck="false" enterkeyhint="go" required>
      <ul id="sugg" role="listbox" hidden></ul>
      <div id="suggStatus" class="sr-only" aria-live="polite"></div>
    </div>
    <p class="tiny">Search by Photon / © OpenStreetMap</p>
    <p id="err" role="alert"></p>
    <button id="go" class="primary" type="submit">Start walking</button>
  </form>
</div>

<div id="game">
  <div id="map"></div>
  <div id="hud">
    <div class="pill grow" id="place"></div>
    <div class="pill" id="keys">WASD / arrows</div>
    <button id="back">Back</button>
  </div>
  <div id="dpad">
    <button class="u" data-dir="up">▲</button>
    <button class="l" data-dir="left">◀</button>
    <button class="r" data-dir="right">▶</button>
    <button class="d" data-dir="down">▼</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var CHARACTERS = ['🧙','🥷','🦸','🧑‍🚀','🤖','🦊','🐱','🐶','🐸','🦄','🐢','👻'];
  var SPEED_MPS = 40;             // walking speed in meters/second (game scale)
  var selected = CHARACTERS[0];
  var map, hero, marker, raf, last;
  var pos = { lat: 0, lng: 0 };
  var keys = {};                  // from keyboard
  var pad = {};                   // from touch buttons

  var $ = function (id) { return document.getElementById(id); };

  // --- character picker
  var charsEl = $('chars');
  CHARACTERS.forEach(function (c, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = c; b.setAttribute('aria-label', 'Character ' + (i + 1));
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', i === 0);
    b.onclick = function () {
      selected = c;
      Array.prototype.forEach.call(charsEl.children, function (x) { x.setAttribute('aria-checked', x === b); });
      $('chosenChar').textContent = c;
      showStep(2);
    };
    charsEl.appendChild(b);
  });
  $('chosenChar').textContent = selected;

  // --- steps: 1 = character, 2 = location, 3 = playing
  var step = 1;
  // --- address autocomplete (Photon)
  var PHOTON = 'https://photon.komoot.io/api/?lang=en&limit=';
  var ac = { ctrl: null, seq: 0, timer: null, items: [], active: -1, chosen: null, cache: {} };
  var addrEl = $('addr'), suggEl = $('sugg');

  function isOpen() { return !suggEl.hidden; }
  function setStatus(t) { $('suggStatus').textContent = t; }
  function openList() {
    suggEl.hidden = false;
    addrEl.setAttribute('aria-expanded', 'true');
  }
  function closeList() {
    suggEl.hidden = true;
    addrEl.setAttribute('aria-expanded', 'false');
    addrEl.removeAttribute('aria-activedescendant');
    ac.active = -1;
  }
  function abortFetch() {
    clearTimeout(ac.timer); ac.timer = null;
    if (ac.ctrl) { ac.ctrl.abort(); ac.ctrl = null; }
    ac.seq++;
  }
  function showInfo(text) {
    ac.items = []; ac.active = -1;
    suggEl.textContent = '';
    var li = document.createElement('li');
    li.className = 'info'; li.textContent = text;
    suggEl.appendChild(li);
    addrEl.removeAttribute('aria-activedescendant');
    openList();
    setStatus(text);
  }
  function toItem(f) {
    var c = f && f.geometry && f.geometry.coordinates;
    if (!c || c.length < 2 || !isFinite(c[0]) || !isFinite(c[1])) return null;
    var p = f.properties || {};
    var road = p.street ? (p.housenumber ? p.housenumber + ' ' + p.street : p.street) : '';
    var main = p.name || road || p.city || p.state || p.country || '';
    if (!main) return null;
    var sec = [], seen = {};
    seen[main.toLowerCase()] = true;
    [p.name ? road : '', p.city, p.state, p.country].forEach(function (x) {
      if (x && !seen[x.toLowerCase()]) { seen[x.toLowerCase()] = true; sec.push(x); }
    });
    sec = sec.join(', ');
    return { lat: +c[1], lng: +c[0], main: main, sec: sec, label: sec ? main + ', ' + sec : main };
  }
  function toItems(data) {
    var out = [], seen = {};
    ((data && data.features) || []).forEach(function (f) {
      var it = toItem(f);
      if (it && !seen[it.label]) { seen[it.label] = true; out.push(it); }
    });
    return out;
  }
  function renderList(items) {
    ac.items = items; ac.active = -1;
    if (!items.length) { showInfo('No matches – press Enter to search anyway'); return; }
    suggEl.textContent = '';
    items.forEach(function (it, i) {
      var li = document.createElement('li');
      li.id = 'sugg-' + i;
      li.setAttribute('role', 'option');
      li.setAttribute('data-i', i);
      li.setAttribute('aria-selected', 'false');
      var m = document.createElement('span'); m.className = 'main'; m.textContent = it.main;
      var s = document.createElement('span'); s.className = 'sec'; s.textContent = it.sec;
      li.appendChild(m); li.appendChild(s);
      suggEl.appendChild(li);
    });
    addrEl.removeAttribute('aria-activedescendant');
    openList();
    setStatus(items.length + (items.length === 1 ? ' suggestion' : ' suggestions'));
  }
  function setActive(i) {
    var n = ac.items.length;
    if (!n) return;
    if (i >= n) i = -1;
    if (i < -1) i = n - 1;
    ac.active = i;
    Array.prototype.forEach.call(suggEl.querySelectorAll('li[role=option]'), function (li, j) {
      li.setAttribute('aria-selected', j === i ? 'true' : 'false');
    });
    if (i < 0) { addrEl.removeAttribute('aria-activedescendant'); return; }
    var el = $('sugg-' + i);
    addrEl.setAttribute('aria-activedescendant', el.id);
    if (el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
  }
  function choose(i) {
    var it = ac.items[i];
    if (!it) return;
    ac.chosen = it;
    addrEl.value = it.label;
    closeList();
    abortFetch();
    var f = $('step2');
    if (f.requestSubmit) f.requestSubmit(); else $('go').click();
  }
  function fetchSuggest(q) {
    if (ac.ctrl) ac.ctrl.abort();
    var ctrl = ac.ctrl = new AbortController();
    var my = ++ac.seq;
    if (!isOpen()) showInfo('Searching…');
    fetch(PHOTON + '6&q=' + encodeURIComponent(q), { signal: ctrl.signal })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        if (my !== ac.seq || addrEl.value.trim() !== q) return;
        ac.ctrl = null;
        var items = toItems(data);
        ac.cache[q.toLowerCase()] = items;
        renderList(items);
      })
      .catch(function (err) {
        if (err && err.name === 'AbortError') return;
        if (my !== ac.seq) return;
        ac.ctrl = null;
        showInfo('Suggestions unavailable – press Enter to search');
      });
  }
  function onInput(e) {
    if (e && e.isComposing) return;
    ac.chosen = null;
    clearTimeout(ac.timer); ac.timer = null;
    var q = addrEl.value.trim();
    if (q.length < 3) { abortFetch(); closeList(); setStatus(''); return; }
    var hit = ac.cache[q.toLowerCase()];
    if (hit) { abortFetch(); renderList(hit); return; }
    ac.timer = setTimeout(function () { ac.timer = null; fetchSuggest(q); }, 250);
  }
  addrEl.addEventListener('input', onInput);
  addrEl.addEventListener('compositionend', function () { onInput(); });
  addrEl.addEventListener('keydown', function (e) {
    if (e.isComposing) return;
    var k = e.key;
    if (k === 'ArrowDown' || k === 'ArrowUp') {
      var n = ac.items.length;
      if (!n) return;
      e.preventDefault();
      if (!isOpen()) { renderList(ac.items); setActive(k === 'ArrowDown' ? 0 : n - 1); }
      else setActive(ac.active + (k === 'ArrowDown' ? 1 : -1));
    } else if (k === 'Enter') {
      if (isOpen() && ac.active >= 0) { e.preventDefault(); choose(ac.active); }
    } else if (k === 'Escape' || k === 'Esc') {
      // target-phase listener runs before the window-level Esc (back a step) handler
      abortFetch();
      if (isOpen()) { e.preventDefault(); e.stopPropagation(); closeList(); }
    } else if (k === 'Tab') {
      closeList();
    }
  });
  suggEl.addEventListener('pointerdown', function (e) { e.preventDefault(); });
  suggEl.addEventListener('click', function (e) {
    var li = e.target.closest && e.target.closest('li[role=option]');
    if (li) choose(+li.getAttribute('data-i'));
  });
  addrEl.addEventListener('blur', function () {
    setTimeout(function () { if (document.activeElement !== addrEl) closeList(); }, 150);
  });
  document.addEventListener('pointerdown', function (e) {
    if (isOpen() && !(e.target.closest && e.target.closest('.combo'))) closeList();
  });
  addrEl.addEventListener('focus', function () {
    var q = addrEl.value.trim();
    var hit = q.length >= 3 && ac.cache[q.toLowerCase()];
    if (hit && hit.length && !isOpen()) renderList(hit);
  });
  function showStep(n) {
    step = n;
    $('step1').hidden = n !== 1;
    $('step2').hidden = n !== 2;
    $('setup').style.display = n < 3 ? 'flex' : 'none';
    keys = {}; pad = {};
    $('err').textContent = '';
    if (typeof closeList === 'function') closeList();
    if (n === 1) {
      var sel = charsEl.querySelector('[aria-checked="true"]');
      if (sel) sel.focus();
    } else if (n === 2) {
      $('addr').focus();
    }
  }
  $('next1').onclick = function () { showStep(2); };
  $('back1').onclick = function () { showStep(1); };
  addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && step === 2 && $('sugg').hidden) showStep(1);
  });

  // --- geocoding (OpenStreetMap Nominatim)
  function geocode(q) {
    return fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=' + encodeURIComponent(q))
      .then(function (r) { if (!r.ok) throw new Error('Lookup failed'); return r.json(); })
      .then(function (res) {
        if (!res.length) throw notFound();
        return { lat: parseFloat(res[0].lat), lng: parseFloat(res[0].lon), name: res[0].display_name };
      })
      .catch(function (err) {
        // network/HTTP failure (not "not found"): try Photon instead
        if (err && err.notFound) throw err;
        return fetch(PHOTON + '1&q=' + encodeURIComponent(q))
          .then(function (r) { if (!r.ok) throw err; return r.json(); }, function () { throw err; })
          .then(function (data) {
            var it = toItems(data)[0];
            if (!it) throw notFound();
            return { lat: it.lat, lng: it.lng, name: it.label };
          });
      });
  }
  function notFound() {
    var e = new Error('Could not find that address. Try adding a city.');
    e.notFound = true;
    return e;
  }

  $('step2').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('go');
    if (btn.disabled) return;
    closeList();
    abortFetch();
    var c = ac.chosen;
    if (c && c.label === $('addr').value) {
      $('err').textContent = '';
      startGame({ lat: c.lat, lng: c.lng, name: c.label });
      return;
    }
    btn.disabled = true; btn.textContent = 'Searching…'; $('err').textContent = '';
    geocode($('addr').value.trim()).then(startGame).catch(function (err) {
      $('err').textContent = err.message || 'Something went wrong.';
    }).then(function () { btn.disabled = false; btn.textContent = 'Start walking'; });
  });

  $('back').onclick = function () {
    cancelAnimationFrame(raf); raf = null;
    $('game').style.display = 'none';
    showStep(2);
  };

  // --- game
  function icon() {
    return L.divIcon({ className: '', iconSize: [40, 40], iconAnchor: [20, 20],
      html: '<div class="hero" id="hero"><span>' + selected + '</span></div>' });
  }

  function startGame(loc) {
    pos = { lat: loc.lat, lng: loc.lng };
    step = 3;
    $('setup').style.display = 'none';
    $('game').style.display = 'block';
    $('place').textContent = '📍 ' + loc.name;

    if (!map) {
      map = L.map('map', { zoomControl: false, keyboard: false, zoomSnap: 0.5 });
      L.control.zoom({ position: 'bottomleft' }).addTo(map);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);
    }
    map.invalidateSize();
    map.setView([pos.lat, pos.lng], 18, { animate: false });
    if (marker) marker.remove();
    marker = L.marker([pos.lat, pos.lng], { icon: icon(), interactive: false, keyboard: false }).addTo(map);
    last = null;
    if (!raf) raf = requestAnimationFrame(tick);
  }

  function tick(t) {
    raf = requestAnimationFrame(tick);
    var dt = last ? Math.min((t - last) / 1000, 0.1) : 0; last = t;
    var dx = (keys.right || pad.right ? 1 : 0) - (keys.left || pad.left ? 1 : 0);
    var dy = (keys.up || pad.up ? 1 : 0) - (keys.down || pad.down ? 1 : 0);
    if (!dx && !dy) return;
    var len = Math.hypot(dx, dy); dx /= len; dy /= len;
    // moves are in screen terms, so speed feels the same at any zoom
    var mpp = 156543.03 * Math.cos(pos.lat * Math.PI / 180) / Math.pow(2, map.getZoom());
    var meters = Math.max(SPEED_MPS, mpp * 120) * dt;   // at least ~120px/s on screen
    pos.lat += (dy * meters) / 111320;
    pos.lng += (dx * meters) / (111320 * Math.cos(pos.lat * Math.PI / 180));
    pos.lat = Math.max(-85, Math.min(85, pos.lat));
    marker.setLatLng([pos.lat, pos.lng]);
    map.panTo([pos.lat, pos.lng], { animate: false });
    var h = document.getElementById('hero');
    if (h && dx) h.classList.toggle('flip', dx < 0);
  }

  // --- keyboard
  var KEYMAP = { w:'up', a:'left', s:'down', d:'right', arrowup:'up', arrowleft:'left', arrowdown:'down', arrowright:'right' };
  function key(e, v) {
    if (step !== 3) return;
    if (e.target && e.target.tagName === 'INPUT') return;
    var k = KEYMAP[e.key.toLowerCase()];
    if (k) { keys[k] = v; e.preventDefault(); }
  }
  addEventListener('keydown', function (e) { key(e, true); });
  addEventListener('keyup', function (e) { key(e, false); });
  addEventListener('blur', function () { keys = {}; pad = {}; });

  // --- touch d-pad (pointer events handle touch + mouse)
  Array.prototype.forEach.call(document.querySelectorAll('#dpad button'), function (b) {
    var d = b.dataset.dir;
    function set(v) { return function (e) { e.preventDefault(); pad[d] = v; b.classList.toggle('on', v); }; }
    b.addEventListener('pointerdown', set(true));
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { b.addEventListener(ev, set(false)); });
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });
})();
</script>
</body>
</html>
