<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Map Walker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#10131a; --panel:#1b2030; --fg:#f2f4f8; --accent:#ffb703; --muted:#8b93a7; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overscroll-behavior:none; }
  #setup { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; z-index:2000; background:var(--bg); overflow:auto; }
  .card { background:var(--panel); border-radius:16px; padding:24px; width:100%; max-width:440px; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  p.sub { margin:0 0 20px; color:var(--muted); }
  label { display:block; font-weight:600; margin:16px 0 8px; }
  .chars { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .chars button { display:flex; align-items:center; justify-content:center; padding:16px 0; background:#262d42; border:2px solid transparent; border-radius:12px; cursor:pointer; }
  .chars button[aria-checked="true"] { border-color:var(--accent); background:#33304a; }
  input[type=text] { width:100%; padding:12px; font-size:1rem; border-radius:10px; border:2px solid #262d42; background:#0d1017; color:var(--fg); }
  input[type=text]:focus { outline:none; border-color:var(--accent); }
  [hidden] { display:none!important; }
  .primary { width:100%; margin-top:20px; padding:14px; font-size:1.05rem; font-weight:700; border:0; border-radius:12px; background:var(--accent); color:#1a1300; cursor:pointer; }
  .primary:disabled { opacity:.6; cursor:wait; }
  .link { background:transparent; color:var(--muted); border:0; padding:6px 0; font-size:.95rem; cursor:pointer; }
  .stephead { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  #chosenChar { display:flex; }
  .tiny { margin:8px 0 0; color:var(--muted); font-size:.75rem; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .combo { position:relative; }
  #sugg { position:absolute; left:0; right:0; top:calc(100% + 4px); max-height:50vh; overflow:auto; list-style:none; margin:0; padding:4px; background:#0d1017; border:2px solid #262d42; border-radius:10px; z-index:10; }
  #sugg li { min-height:44px; padding:10px 12px; border-radius:8px; cursor:pointer; display:flex; flex-direction:column; justify-content:center; }
  #sugg li .main { color:var(--fg); font-weight:600; }
  #sugg li .sec { color:var(--muted); font-size:.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #sugg li[aria-selected=true], #sugg li:hover { background:#262d42; }
  #sugg li.info { color:var(--muted); cursor:default; }
  #err { color:#ff7b7b; min-height:1.2em; margin:10px 0 0; font-size:.9rem; }
  #game { position:fixed; inset:0; display:none; }
  #map { position:absolute; inset:0; }
  .hero { line-height:0; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  .hero.flip svg { transform:scaleX(-1); }
  #status { white-space:nowrap; }
  #status.err { background:#5c1d24; }
  #hud { position:absolute; top:10px; left:10px; right:10px; z-index:1000; display:flex; gap:8px; align-items:center; pointer-events:none; }
  #hud .pill { pointer-events:auto; background:rgba(16,19,26,.85); color:var(--fg); padding:8px 12px; border-radius:999px; font-size:.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #hud .grow { flex:1; min-width:0; }
  #hud button { pointer-events:auto; border:0; background:rgba(16,19,26,.85); color:var(--fg); padding:8px 12px; border-radius:999px; font-size:.85rem; cursor:pointer; }
  #dpad { position:absolute; right:18px; bottom:28px; z-index:1000; width:150px; height:150px; display:none; touch-action:none; user-select:none; -webkit-user-select:none; }
  #dpad button { position:absolute; width:50px; height:50px; border:0; border-radius:12px; background:rgba(16,19,26,.75); color:#fff; font-size:1.3rem; touch-action:none; }
  #dpad .u { left:50px; top:0; } #dpad .d { left:50px; bottom:0; } #dpad .l { left:0; top:50px; } #dpad .r { right:0; top:50px; }
  #dpad button.on { background:var(--accent); color:#000; }
  @media (pointer:coarse), (max-width:700px) { #dpad { display:block; } #keys { display:none; } }
</style>
</head>
<body>
<div id="setup">
  <section class="card step" id="step1">
    <h1>🗺️ Map Walker</h1>
    <p class="sub">Pick your character</p>
    <div class="chars" id="chars" role="radiogroup" aria-label="Character"></div>
    <button id="next1" class="primary" type="button">Next</button>
  </section>
  <form class="card step" id="step2" hidden>
    <div class="stephead">
      <button id="back1" class="link" type="button">← Back</button>
      <span id="chosenChar" aria-hidden="true"></span>
    </div>
    <h1>Pick location</h1>
    <label for="addr">Address</label>
    <div class="combo">
      <input type="text" id="addr" placeholder="e.g. 1600 Pennsylvania Ave, Washington DC" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugg" autocomplete="off" spellcheck="false" enterkeyhint="go" required>
      <ul id="sugg" role="listbox" hidden></ul>
      <div id="suggStatus" class="sr-only" aria-live="polite"></div>
    </div>
    <p class="tiny">Search by Photon / © OpenStreetMap</p>
    <p id="err" role="alert"></p>
    <button id="go" class="primary" type="submit">Start walking</button>
  </form>
</div>

<div id="game">
  <div id="map"></div>
  <div id="hud">
    <div class="pill grow" id="place"></div>
    <div class="pill" id="keys">WASD / arrows</div>
    <button id="status" hidden></button>
    <button id="back">Back</button>
  </div>
  <div id="dpad">
    <button class="u" data-dir="up">▲</button>
    <button class="l" data-dir="left">◀</button>
    <button class="r" data-dir="right">▶</button>
    <button class="d" data-dir="down">▼</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  // the three figures from the mockup: head + body shape
  var CHARACTERS = [
    { name: 'Vee', color: '#4cc9f0', body: '<path d="M7 23 L33 23 L20 47 Z"/>' },
    { name: 'Delta', color: '#f72585', body: '<path d="M20 22 L34 47 L6 47 Z"/><path d="M11 33 L29 33" fill="none"/>' },
    { name: 'Bubble', color: '#80ed99', body: '<circle cx="20" cy="35" r="12"/>' }
  ];
  var SPEED_MPS = 40;             // walking speed in meters/second (game scale)
  var selected = CHARACTERS[0];
  var map, marker, raf, last;
  var keys = {};                  // from keyboard
  var pad = {};                   // from touch buttons

  var $ = function (id) { return document.getElementById(id); };

  function charSvg(c, h) {
    return '<svg viewBox="0 0 40 50" width="' + h * 0.8 + '" height="' + h + '" fill="' + c.color +
      '" stroke="#10131a" stroke-width="2.5" stroke-linejoin="round" aria-hidden="true">' +
      '<circle cx="20" cy="11" r="8"/>' + c.body + '</svg>';
  }

  // --- character picker
  var charsEl = $('chars');
  CHARACTERS.forEach(function (c, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.innerHTML = charSvg(c, 64); b.setAttribute('aria-label', c.name);
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', i === 0);
    b.onclick = function () {
      selected = c;
      Array.prototype.forEach.call(charsEl.children, function (x) { x.setAttribute('aria-checked', x === b); });
      $('chosenChar').innerHTML = charSvg(c, 32);
      showStep(2);
    };
    charsEl.appendChild(b);
  });
  $('chosenChar').innerHTML = charSvg(selected, 32);

  // --- steps: 1 = character, 2 = location, 3 = playing
  var step = 1;
  // --- address autocomplete (Photon)
  var PHOTON = 'https://photon.komoot.io/api/?lang=en&limit=';
  var ac = { ctrl: null, seq: 0, timer: null, items: [], active: -1, chosen: null, cache: {} };
  var addrEl = $('addr'), suggEl = $('sugg');

  function isOpen() { return !suggEl.hidden; }
  function setStatus(t) { $('suggStatus').textContent = t; }
  function openList() {
    suggEl.hidden = false;
    addrEl.setAttribute('aria-expanded', 'true');
  }
  function closeList() {
    suggEl.hidden = true;
    addrEl.setAttribute('aria-expanded', 'false');
    addrEl.removeAttribute('aria-activedescendant');
    ac.active = -1;
  }
  function abortFetch() {
    clearTimeout(ac.timer); ac.timer = null;
    if (ac.ctrl) { ac.ctrl.abort(); ac.ctrl = null; }
    ac.seq++;
  }
  function showInfo(text) {
    ac.items = []; ac.active = -1;
    suggEl.textContent = '';
    var li = document.createElement('li');
    li.className = 'info'; li.textContent = text;
    suggEl.appendChild(li);
    addrEl.removeAttribute('aria-activedescendant');
    openList();
    setStatus(text);
  }
  function toItem(f) {
    var c = f && f.geometry && f.geometry.coordinates;
    if (!c || c.length < 2 || !isFinite(c[0]) || !isFinite(c[1])) return null;
    var p = f.properties || {};
    var road = p.street ? (p.housenumber ? p.housenumber + ' ' + p.street : p.street) : '';
    var main = p.name || road || p.city || p.state || p.country || '';
    if (!main) return null;
    var sec = [], seen = {};
    seen[main.toLowerCase()] = true;
    [p.name ? road : '', p.city, p.state, p.country].forEach(function (x) {
      if (x && !seen[x.toLowerCase()]) { seen[x.toLowerCase()] = true; sec.push(x); }
    });
    sec = sec.join(', ');
    return { lat: +c[1], lng: +c[0], main: main, sec: sec, label: sec ? main + ', ' + sec : main };
  }
  function toItems(data) {
    var out = [], seen = {};
    ((data && data.features) || []).forEach(function (f) {
      var it = toItem(f);
      if (it && !seen[it.label]) { seen[it.label] = true; out.push(it); }
    });
    return out;
  }
  function renderList(items) {
    ac.items = items; ac.active = -1;
    if (!items.length) { showInfo('No matches – press Enter to search anyway'); return; }
    suggEl.textContent = '';
    items.forEach(function (it, i) {
      var li = document.createElement('li');
      li.id = 'sugg-' + i;
      li.setAttribute('role', 'option');
      li.setAttribute('data-i', i);
      li.setAttribute('aria-selected', 'false');
      var m = document.createElement('span'); m.className = 'main'; m.textContent = it.main;
      var s = document.createElement('span'); s.className = 'sec'; s.textContent = it.sec;
      li.appendChild(m); li.appendChild(s);
      suggEl.appendChild(li);
    });
    addrEl.removeAttribute('aria-activedescendant');
    openList();
    setStatus(items.length + (items.length === 1 ? ' suggestion' : ' suggestions'));
  }
  function setActive(i) {
    var n = ac.items.length;
    if (!n) return;
    if (i >= n) i = -1;
    if (i < -1) i = n - 1;
    ac.active = i;
    Array.prototype.forEach.call(suggEl.querySelectorAll('li[role=option]'), function (li, j) {
      li.setAttribute('aria-selected', j === i ? 'true' : 'false');
    });
    if (i < 0) { addrEl.removeAttribute('aria-activedescendant'); return; }
    var el = $('sugg-' + i);
    addrEl.setAttribute('aria-activedescendant', el.id);
    if (el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
  }
  function choose(i) {
    var it = ac.items[i];
    if (!it) return;
    ac.chosen = it;
    addrEl.value = it.label;
    closeList();
    abortFetch();
    var f = $('step2');
    if (f.requestSubmit) f.requestSubmit(); else $('go').click();
  }
  function fetchSuggest(q) {
    if (ac.ctrl) ac.ctrl.abort();
    var ctrl = ac.ctrl = new AbortController();
    var my = ++ac.seq;
    if (!isOpen()) showInfo('Searching…');
    fetch(PHOTON + '6&q=' + encodeURIComponent(q), { signal: ctrl.signal })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        if (my !== ac.seq || addrEl.value.trim() !== q) return;
        ac.ctrl = null;
        var items = toItems(data);
        ac.cache[q.toLowerCase()] = items;
        renderList(items);
      })
      .catch(function (err) {
        if (err && err.name === 'AbortError') return;
        if (my !== ac.seq) return;
        ac.ctrl = null;
        showInfo('Suggestions unavailable – press Enter to search');
      });
  }
  function onInput(e) {
    if (e && e.isComposing) return;
    ac.chosen = null;
    clearTimeout(ac.timer); ac.timer = null;
    var q = addrEl.value.trim();
    if (q.length < 3) { abortFetch(); closeList(); setStatus(''); return; }
    var hit = ac.cache[q.toLowerCase()];
    if (hit) { abortFetch(); renderList(hit); return; }
    ac.timer = setTimeout(function () { ac.timer = null; fetchSuggest(q); }, 250);
  }
  addrEl.addEventListener('input', onInput);
  addrEl.addEventListener('compositionend', function () { onInput(); });
  addrEl.addEventListener('keydown', function (e) {
    if (e.isComposing) return;
    var k = e.key;
    if (k === 'ArrowDown' || k === 'ArrowUp') {
      var n = ac.items.length;
      if (!n) return;
      e.preventDefault();
      if (!isOpen()) { renderList(ac.items); setActive(k === 'ArrowDown' ? 0 : n - 1); }
      else setActive(ac.active + (k === 'ArrowDown' ? 1 : -1));
    } else if (k === 'Enter') {
      if (isOpen() && ac.active >= 0) { e.preventDefault(); choose(ac.active); }
    } else if (k === 'Escape' || k === 'Esc') {
      // target-phase listener runs before the window-level Esc (back a step) handler
      abortFetch();
      if (isOpen()) { e.preventDefault(); e.stopPropagation(); closeList(); }
    } else if (k === 'Tab') {
      closeList();
    }
  });
  suggEl.addEventListener('pointerdown', function (e) { e.preventDefault(); });
  suggEl.addEventListener('click', function (e) {
    var li = e.target.closest && e.target.closest('li[role=option]');
    if (li) choose(+li.getAttribute('data-i'));
  });
  addrEl.addEventListener('blur', function () {
    setTimeout(function () { if (document.activeElement !== addrEl) closeList(); }, 150);
  });
  document.addEventListener('pointerdown', function (e) {
    if (isOpen() && !(e.target.closest && e.target.closest('.combo'))) closeList();
  });
  addrEl.addEventListener('focus', function () {
    var q = addrEl.value.trim();
    var hit = q.length >= 3 && ac.cache[q.toLowerCase()];
    if (hit && hit.length && !isOpen()) renderList(hit);
  });
  function showStep(n) {
    step = n;
    $('step1').hidden = n !== 1;
    $('step2').hidden = n !== 2;
    $('setup').style.display = n < 3 ? 'flex' : 'none';
    keys = {}; pad = {};
    $('err').textContent = '';
    if (typeof closeList === 'function') closeList();
    if (n === 1) {
      var sel = charsEl.querySelector('[aria-checked="true"]');
      if (sel) sel.focus();
    } else if (n === 2) {
      $('addr').focus();
    }
  }
  $('next1').onclick = function () { showStep(2); };
  $('back1').onclick = function () { showStep(1); };
  addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && step === 2 && $('sugg').hidden) showStep(1);
  });

  // --- geocoding (OpenStreetMap Nominatim)
  function geocode(q) {
    return fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=' + encodeURIComponent(q))
      .then(function (r) { if (!r.ok) throw new Error('Lookup failed'); return r.json(); })
      .then(function (res) {
        if (!res.length) throw notFound();
        return { lat: parseFloat(res[0].lat), lng: parseFloat(res[0].lon), name: res[0].display_name };
      })
      .catch(function (err) {
        // network/HTTP failure (not "not found"): try Photon instead
        if (err && err.notFound) throw err;
        return fetch(PHOTON + '1&q=' + encodeURIComponent(q))
          .then(function (r) { if (!r.ok) throw err; return r.json(); }, function () { throw err; })
          .then(function (data) {
            var it = toItems(data)[0];
            if (!it) throw notFound();
            return { lat: it.lat, lng: it.lng, name: it.label };
          });
      });
  }
  function notFound() {
    var e = new Error('Could not find that address. Try adding a city.');
    e.notFound = true;
    return e;
  }

  $('step2').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('go');
    if (btn.disabled) return;
    closeList();
    abortFetch();
    var c = ac.chosen;
    if (c && c.label === $('addr').value) {
      $('err').textContent = '';
      startGame({ lat: c.lat, lng: c.lng, name: c.label });
      return;
    }
    btn.disabled = true; btn.textContent = 'Searching…'; $('err').textContent = '';
    geocode($('addr').value.trim()).then(startGame).catch(function (err) {
      $('err').textContent = err.message || 'Something went wrong.';
    }).then(function () { btn.disabled = false; btn.textContent = 'Start walking'; });
  });

  $('back').onclick = function () {
    cancelAnimationFrame(raf); raf = null;
    $('game').style.display = 'none';
    showStep(2);
  };

  // --- street network (OpenStreetMap via Overpass): the hero can only walk along these
  var OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
  var ROAD_TYPES = 'motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|pedestrian|road|' +
    'motorway_link|trunk_link|primary_link|secondary_link|tertiary_link';
  var LOAD_RADIUS = 800;          // meters of streets fetched per request
  var CELL = 50;                  // grid cell size (m) for the node index
  var EPS = 0.05;                 // two points closer than this (m) are the same node
  var net = null;                 // { lat0, lng0, kx, ky, segs, grid, ways, centers, loading, ready }
  var p = { x: 0, y: 0 };         // hero position in local meters (x east, y north)
  var cur = -1;                   // index of the segment the hero is on
  var heading = { x: 0, y: 0 };   // last movement direction

  function newNet(lat, lng) {
    return { lat0: lat, lng0: lng, kx: 111320 * Math.cos(lat * Math.PI / 180), ky: 110574,
      segs: [], grid: {}, ways: {}, centers: [], loading: false, ready: false };
  }
  function toXY(lat, lng) { return { x: (lng - net.lng0) * net.kx, y: (lat - net.lat0) * net.ky }; }
  function toLL(x, y) { return L.latLng(net.lat0 + y / net.ky, net.lng0 + x / net.kx); }
  function cellKey(x, y) { return Math.floor(x / CELL) + ',' + Math.floor(y / CELL); }
  function indexNode(x, y, i) {
    var k = cellKey(x, y);
    (net.grid[k] || (net.grid[k] = [])).push(i);
  }

  function addWays(n, elements) {
    elements.forEach(function (w) {
      if (w.type !== 'way' || !w.geometry || n.ways[w.id]) return;
      n.ways[w.id] = true;
      for (var j = 1; j < w.geometry.length; j++) {
        var a = w.geometry[j - 1], b = w.geometry[j];
        if (!a || !b) continue;   // Overpass leaves gaps where a node is missing
        var A = toXY(a.lat, a.lon), B = toXY(b.lat, b.lon);
        var i = n.segs.push({ ax: A.x, ay: A.y, bx: B.x, by: B.y }) - 1;
        indexNode(A.x, A.y, i); indexNode(B.x, B.y, i);
      }
    });
  }

  function fetchRoads(x, y, attempt) {
    var ll = toLL(x, y);
    var q = '[out:json][timeout:25];way["highway"~"^(' + ROAD_TYPES + ')$"](around:' + LOAD_RADIUS + ',' +
      ll.lat.toFixed(6) + ',' + ll.lng.toFixed(6) + ');out geom;';
    var url = OVERPASS[attempt % OVERPASS.length];
    return fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(q),
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' } })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .catch(function (err) {
        if (attempt + 1 >= OVERPASS.length * 2) throw err;
        return new Promise(function (res) { setTimeout(res, 800 * (attempt + 1)); })
          .then(function () { return fetchRoads(x, y, attempt + 1); });
      });
  }

  function loadRoads(x, y) {
    var n = net;
    n.loading = true;
    if (!n.ready) hudStatus('Loading streets…');
    fetchRoads(x, y, 0).then(function (data) {
      if (n !== net) return;      // a newer game started meanwhile
      n.loading = false;
      n.centers.push({ x: x, y: y });
      addWays(n, data.elements || []);
      if (!n.ready) {
        if (!n.segs.length) { hudStatus('No streets nearby – try another address', true); return; }
        snapToStreet();
        n.ready = true;
        hudStatus('');
        placeHero();
      }
    }).catch(function () {
      if (n !== net) return;
      n.loading = false;
      if (!n.ready) hudStatus('Couldn’t load streets – tap to retry', true, function () { loadRoads(x, y); });
      else n.retryAt = Date.now() + 5000;
    });
  }

  function maybeLoadMore() {
    if (net.loading || (net.retryAt && Date.now() < net.retryAt)) return;
    for (var i = 0; i < net.centers.length; i++) {
      var c = net.centers[i];
      if (Math.hypot(c.x - p.x, c.y - p.y) < LOAD_RADIUS * 0.5) return;
    }
    loadRoads(p.x, p.y);
  }

  function hudStatus(text, isErr, onClick) {
    var s = $('status');
    s.hidden = !text; s.textContent = text;
    s.classList.toggle('err', !!isErr);
    s.onclick = onClick || null;
    s.style.cursor = onClick ? 'pointer' : 'default';
  }

  // put the hero on the closest point of any street; snap to a node if one is near
  function snapToStreet() {
    var best = Infinity, q = null;
    net.segs.forEach(function (s, i) {
      var vx = s.bx - s.ax, vy = s.by - s.ay, L2 = vx * vx + vy * vy;
      var t = L2 ? Math.max(0, Math.min(1, ((p.x - s.ax) * vx + (p.y - s.ay) * vy) / L2)) : 0;
      var x = s.ax + t * vx, y = s.ay + t * vy, d = Math.hypot(x - p.x, y - p.y);
      if (d < best) { best = d; cur = i; q = { x: x, y: y }; }
    });
    var s = net.segs[cur];
    if (Math.hypot(s.ax - q.x, s.ay - q.y) < 2) q = { x: s.ax, y: s.ay };
    else if (Math.hypot(s.bx - q.x, s.by - q.y) < 2) q = { x: s.bx, y: s.by };
    p = q;
  }

  // every direction the hero can go from (x, y) on segment `cur`: along that segment,
  // plus along any segment that has a node at this exact spot (an intersection)
  function options(x, y) {
    var out = [], seen = {}, ids = cur >= 0 ? [cur] : [];
    var cx = Math.floor(x / CELL), cy = Math.floor(y / CELL);
    for (var gx = cx - 1; gx <= cx + 1; gx++) for (var gy = cy - 1; gy <= cy + 1; gy++) {
      (net.grid[gx + ',' + gy] || []).forEach(function (i) { ids.push(i); });
    }
    ids.forEach(function (i) {
      if (seen[i]) return; seen[i] = true;
      var s = net.segs[i];
      var onIt = i === cur || Math.hypot(s.ax - x, s.ay - y) < EPS || Math.hypot(s.bx - x, s.by - y) < EPS;
      if (!onIt) return;
      [[s.ax, s.ay], [s.bx, s.by]].forEach(function (e) {
        var vx = e[0] - x, vy = e[1] - y, L = Math.hypot(vx, vy);
        if (L < EPS) return;
        out.push({ seg: i, tx: e[0], ty: e[1], len: L, ux: vx / L, uy: vy / L });
      });
    });
    return out;
  }

  // the option best matching input (ix, iy); at a fork, the most recently pressed
  // direction (fx, fy) wins, so holding one key and pressing another turns there
  function pick(opts, ix, iy, fx, fy) {
    var best = null, score = -1;
    opts.forEach(function (o) {
      var d = o.ux * ix + o.uy * iy;
      if (d <= 0.3) return;
      var s = d + (o.ux * fx + o.uy * fy > 0.7 ? 1 : 0);
      if (s > score) { score = s; best = o; }
    });
    return best;
  }

  // move up to `dist` meters toward input (ix, iy), following streets;
  // `snap` is how far (m) a turn pressed a little early or late reaches for the corner
  function walk(ix, iy, fx, fy, dist, snap) {
    var moved = false;
    for (var n = 0; n < 32 && dist > 1e-6; n++) {
      var opts = options(p.x, p.y), best = pick(opts, ix, iy, fx, fy);
      if (!best && (heading.x || heading.y) && ix * heading.x + iy * heading.y > 0.3) {
        // a bend with only one way onward: keep following the street around it
        var fwd = opts.filter(function (o) { return o.ux * heading.x + o.uy * heading.y > -0.7; });
        if (fwd.length === 1 && fwd[0].ux * heading.x + fwd[0].uy * heading.y > 0.5) best = fwd[0];
      }
      if (!best && !moved && cur >= 0) {
        // just missed a corner: hop to the nearby node if the asked-for street leaves from it
        var s = net.segs[cur], hop = null;
        [[s.ax, s.ay], [s.bx, s.by]].forEach(function (e) {
          var d = Math.hypot(e[0] - p.x, e[1] - p.y);
          if (d >= EPS && d <= snap && pick(options(e[0], e[1]), ix, iy, fx, fy)) hop = { x: e[0], y: e[1] };
        });
        if (hop) { p = hop; moved = true; continue; }
      }
      if (!best) break;
      if (dist >= best.len) { p = { x: best.tx, y: best.ty }; dist -= best.len; }
      else { p = { x: p.x + best.ux * dist, y: p.y + best.uy * dist }; dist = 0; }
      cur = best.seg; heading = { x: best.ux, y: best.uy }; moved = true;
    }
    return moved;
  }

  // --- game
  function icon() {
    return L.divIcon({ className: '', iconSize: [40, 50], iconAnchor: [20, 47],
      html: '<div class="hero" id="hero">' + charSvg(selected, 50) + '</div>' });
  }

  function placeHero() {
    var ll = toLL(p.x, p.y);
    marker.setLatLng(ll);
    map.panTo(ll, { animate: false });
  }

  function startGame(loc) {
    net = newNet(loc.lat, loc.lng);
    p = { x: 0, y: 0 }; cur = -1; heading = { x: 0, y: 0 };
    var pos = { lat: loc.lat, lng: loc.lng };
    step = 3;
    $('setup').style.display = 'none';
    $('game').style.display = 'block';
    $('place').textContent = '📍 ' + loc.name;

    if (!map) {
      map = L.map('map', { zoomControl: false, keyboard: false, zoomSnap: 0.5 });
      L.control.zoom({ position: 'bottomleft' }).addTo(map);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);
    }
    map.invalidateSize();
    map.setView([pos.lat, pos.lng], 18, { animate: false });
    if (marker) marker.remove();
    marker = L.marker([pos.lat, pos.lng], { icon: icon(), interactive: false, keyboard: false }).addTo(map);
    last = null;
    loadRoads(0, 0);
    if (!raf) raf = requestAnimationFrame(tick);
  }

  function tick(t) {
    raf = requestAnimationFrame(tick);
    var dt = last ? Math.min((t - last) / 1000, 0.1) : 0; last = t;
    var held = {}, newest = null;
    ['up', 'down', 'left', 'right'].forEach(function (d) {
      held[d] = Math.max(keys[d] || 0, pad[d] || 0);   // press time, 0 if not held
      if (held[d] && (!newest || held[d] > held[newest])) newest = d;
    });
    var dx = (held.right ? 1 : 0) - (held.left ? 1 : 0);
    var dy = (held.up ? 1 : 0) - (held.down ? 1 : 0);
    if (!dx && !dy) return;
    if (!net || !net.ready) return;
    var len = Math.hypot(dx, dy); dx /= len; dy /= len;
    var DIRS = { up: [0, 1], down: [0, -1], left: [-1, 0], right: [1, 0] };
    // speed is in screen terms, so it feels the same at any zoom
    var mpp = 156543.03 * Math.cos(net.lat0 * Math.PI / 180) / Math.pow(2, map.getZoom());
    var meters = Math.max(SPEED_MPS, mpp * 120) * dt;   // at least ~120px/s on screen
    if (!walk(dx, dy, DIRS[newest][0], DIRS[newest][1], meters, Math.max(4, mpp * 16))) return;
    placeHero();
    var h = document.getElementById('hero');
    if (h && Math.abs(heading.x) > 0.2) h.classList.toggle('flip', heading.x < 0);
    maybeLoadMore();
  }

  // --- keyboard
  var KEYMAP = { w:'up', a:'left', s:'down', d:'right', arrowup:'up', arrowleft:'left', arrowdown:'down', arrowright:'right' };
  function key(e, v) {
    if (step !== 3) return;
    if (e.target && e.target.tagName === 'INPUT') return;
    var k = KEYMAP[e.key.toLowerCase()];
    if (k) {
      // remember when each key went down (ignoring auto-repeat) so the newest one wins at forks
      if (!v) keys[k] = 0; else if (!keys[k]) keys[k] = performance.now();
      e.preventDefault();
    }
  }
  addEventListener('keydown', function (e) { key(e, true); });
  addEventListener('keyup', function (e) { key(e, false); });
  addEventListener('blur', function () { keys = {}; pad = {}; });

  // --- touch d-pad (pointer events handle touch + mouse)
  Array.prototype.forEach.call(document.querySelectorAll('#dpad button'), function (b) {
    var d = b.dataset.dir;
    function set(v) {
      return function (e) {
        e.preventDefault();
        if (!v) pad[d] = 0; else if (!pad[d]) pad[d] = performance.now();
        b.classList.toggle('on', v);
      };
    }
    b.addEventListener('pointerdown', set(true));
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { b.addEventListener(ev, set(false)); });
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });
})();
</script>
</body>
</html>
