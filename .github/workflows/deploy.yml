# Street Quest on the apps server: the map proxy at streetquest-api.<domain>, the site at streetquest.<domain>.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api:
    uses: ./.github/workflows/deploy-app.yml
    with:
      name: streetquest-api
      type: node
      start: node server/index.mjs
      health_path: /health
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}

  site:
    needs: api
    uses: ./.github/workflows/deploy-app.yml
    with:
      name: streetquest
      type: static
      build: npm ci && npm test && VITE_API_URL=https://streetquest-api.$APPS_DOMAIN npm run build
      dir: dist
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
